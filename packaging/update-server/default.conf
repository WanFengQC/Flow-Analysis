# Flow Analysis 内网更新静态站点；只发布签名清单和安装包，不承载业务接口。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;

    location = /flow-analysis/stable.json {
        default_type application/json;
        try_files /flow-analysis/stable.json =404;
    }

    # 安装包与清单同属本应用发布目录，但安装包文件位于 releases 根目录。
    location /releases/ {
        types { application/octet-stream exe; }
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
